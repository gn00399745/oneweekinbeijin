<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
<title>相約北京</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c140d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="皇城探祕記">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.css" />
<link rel="stylesheet" href="journal.css">
<style>
:root{
  --ink:#2B221C;
  --ink-soft:#5A4C3F;
  --paper:#FBF3E4;
  --paper-deep:#F2E5CC;
  --panel:#FFFDF7;
  --red:#9E2A2B;
  --red-dark:#7A1F20;
  --gold:#C9962E;
  --gold-light:#E4C878;
  --blue:#2B5F75;
  --jade:#4C7A5A;
  --plum:#6B4A7A;
  --bronze:#8B5E34;
  --line:#E3D2AC;
  --shadow: 0 10px 30px rgba(43,34,28,.18);
  --radius: 18px;
  font-size: 20px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family: "PingFang TC","Microsoft JhengHei","Heiti TC","Noto Sans TC",sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
button{font-family:inherit;}

/* ---------- decorative top pattern ---------- */
.imperial-rule{
  height:10px;
  background: repeating-linear-gradient(90deg, var(--red) 0 26px, var(--gold) 26px 30px, var(--red) 30px 56px, transparent 56px 60px);
  opacity:.9;
}

/* ---------- HERO ---------- */
header.hero{
  position:relative;
  padding: 30px 20px 26px;
  background:
    radial-gradient(1200px 400px at 15% -10%, rgba(201,150,46,.25), transparent 60%),
    linear-gradient(160deg, var(--red) 0%, var(--red-dark) 60%, #5c1516 100%);
  color:#FBEFD9;
  text-align:center;
  overflow:hidden;
}
header.hero::before,header.hero::after{
  content:"雲";
  position:absolute; font-size:220px; opacity:.06; color:#fff; font-family:serif;
  top:-60px; pointer-events:none; z-index:0;
}
header.hero::before{left:-40px;}
header.hero::after{right:-50px; transform:scaleX(-1);}
.hero-eyebrow{
  letter-spacing:.5em; font-size:.85rem; color:var(--gold-light); margin-bottom:10px;
}
.hero h1{
  font-size: 2.6rem;
  margin:0 0 10px;
  font-weight:900;
  letter-spacing:.06em;
  text-shadow: 0 3px 0 rgba(0,0,0,.25);
}
.hero p.subtitle{
  font-size:1.25rem;
  margin:0;
  color:#FBEFD9;
  opacity:.95;
}
.hero .tag-row{
  margin-top:22px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
}
.hero .tag{
  background:rgba(255,255,255,.14);
  border:2px solid var(--gold-light);
  border-radius:999px;
  padding:8px 20px;
  font-size:1rem;
  color:#FBEFD9;
}

/* ---------- DAY NAV ---------- */
nav.day-nav{
  position:sticky; top:0; z-index:50;
  background: var(--paper-deep);
  border-bottom:4px solid var(--gold);
  padding:12px 10px;
  display:flex; gap:10px; overflow-x:auto;
  box-shadow: var(--shadow);
}
nav.day-nav::-webkit-scrollbar{height:8px;}
.day-btn{
  flex: 0 0 auto;
  border:3px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  border-radius: 14px;
  padding: 12px 18px;
  font-size:1.05rem;
  font-weight:700;
  cursor:pointer;
  min-height:56px;
  min-width:118px;
  transition: transform .15s ease, box-shadow .15s ease;
  text-align:center;
}
.day-btn small{display:block; font-weight:500; font-size:.8rem; color:var(--ink-soft); margin-top:2px;}
.day-btn:hover{ transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,.12);}
.day-btn.active{
  background: var(--day-color, var(--red));
  color:#fff;
  border-color: var(--day-color, var(--red));
  box-shadow: 0 8px 18px rgba(0,0,0,.22);
}
.day-btn.active small{color:#fff; opacity:.9;}

/* ---------- MAIN LAYOUT ---------- */
main{ max-width:1180px; margin:0 auto; padding: 22px 16px 70px;}
.day-heading{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  margin: 6px 0 18px;
}
.day-heading h2{
  font-size:1.9rem; margin:0; color:var(--red-dark);
  border-left: 10px solid var(--day-color, var(--red));
  padding-left:14px;
}
.day-heading .hotel-chip{
  background:var(--panel);
  border:2px solid var(--line);
  border-radius:14px;
  padding:10px 16px;
  font-size:1rem;
  display:flex; align-items:center; gap:10px;
  box-shadow: var(--shadow);
}
.day-heading .hotel-chip b{color:var(--red-dark);}

#map{
  width:100%; height: 460px;
  border-radius: var(--radius);
  border: 5px solid var(--panel);
  box-shadow: var(--shadow);
  outline: 3px solid var(--day-color, var(--gold));
}
.map-hint{
  text-align:center; color:var(--ink-soft); font-size:.95rem; margin:10px 0 26px;
}

/* legend */
.legend{
  display:flex; gap:18px; flex-wrap:wrap; justify-content:center;
  margin: 14px 0 30px;
  font-size:.95rem; color:var(--ink-soft);
}
.legend span{display:inline-flex; align-items:center; gap:6px;}
.legend .dot{width:16px;height:16px;border-radius:50%; display:inline-block; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.2);}

/* section title */
.section-title{
  font-size:1.5rem; color:var(--red-dark); margin: 34px 0 14px;
  display:flex; align-items:center; gap:10px;
}
.section-title .bead{width:12px;height:12px;border-radius:50%;background:var(--gold);}

/* ---------- CARDS: itinerary / meals / hotel ---------- */
.grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap:16px; }
.card{
  background: var(--panel);
  border-radius: var(--radius);
  border:2px solid var(--line);
  box-shadow: var(--shadow);
  padding: 18px 20px;
  cursor:pointer;
  transition: transform .15s ease, box-shadow .15s ease;
  position:relative;
}
.card:hover{ transform: translateY(-3px); box-shadow:0 14px 30px rgba(43,34,28,.22);}
.card .kicker{
  font-size:.85rem; font-weight:700; letter-spacing:.15em; color:#fff;
  background: var(--day-color, var(--red));
  display:inline-block; padding:4px 12px; border-radius:999px; margin-bottom:10px;
}
.card h3{ margin:0 0 8px; font-size:1.3rem; color:var(--ink);}
.card p{ margin:0; color:var(--ink-soft); font-size:1rem; }
.card .num{
  position:absolute; top:14px; right:16px;
  width:34px; height:34px; border-radius:50%;
  background:var(--gold); color:#fff; font-weight:900;
  display:flex; align-items:center; justify-content:center; font-size:1.1rem;
}
.card.meal{border-left:8px solid var(--jade);}
.card.hotel{border-left:8px solid var(--blue);}
.card.stop{border-left:8px solid var(--day-color, var(--red));}
.card.special{
  background: linear-gradient(135deg, #fff 60%, #FBEFD1 100%);
  border-color: var(--gold);
}
.card .open-hint{ margin-top:10px; font-size:.9rem; color:var(--gold); font-weight:700;}
.card-photo{ width:100%; height:150px; object-fit:cover; border-radius:12px; margin-bottom:12px; border:2px solid var(--line);}
.card-photo-placeholder{
  width:100%; height:150px; border-radius:12px; margin-bottom:12px;
  display:flex; align-items:center; justify-content:center; font-size:2.6rem;
  background: linear-gradient(135deg, var(--day-color, var(--red)), var(--gold));
  border:2px solid var(--line);
}
.breakfast-note{
  margin-top:14px; padding:12px 16px; background:var(--paper-deep);
  border-radius:12px; border:2px dashed var(--line); font-size:1rem; color:var(--ink-soft);
}
.breakfast-note b{color:var(--ink);}
.modal-photo-credit{ font-size:.8rem; color:var(--ink-soft); text-align:right; margin-top:-6px; margin-bottom:10px;}
.zoom-map{
  width:100%; height:420px; border-radius:14px; overflow:hidden; border:3px solid var(--gold-light);
  background:#eee;
}
.zoom-hint{ text-align:center; font-size:.9rem; color:var(--ink-soft); margin-top:8px;}
.map-fullscreen-wrap{ position:relative; }
.map-fullscreen-wrap .zoom-map{ margin:0; }
.fullscreen-btn{
  position:absolute; top:10px; right:10px; z-index:600;
  background:#fff; border:2px solid var(--gold); color:var(--red-dark);
  font-weight:800; font-size:.95rem; padding:8px 14px; border-radius:10px;
  cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.3);
}
.fullscreen-btn:hover{ background:var(--paper-deep); }
.map-fullscreen-wrap:fullscreen{ background:#fff; padding:0; }
.map-fullscreen-wrap:fullscreen .zoom-map{ height:100vh !important; border-radius:0; }
.map-fullscreen-wrap:-webkit-full-screen .zoom-map{ height:100vh !important; border-radius:0; }
/* text-label style for the Forbidden City hall map -- like an OSM place label,
   used instead of large pin icons so 30+ closely-packed buildings stay readable */
.gugong-label{
  background:rgba(255,253,247,.92); border:1px solid var(--red); border-radius:4px;
  padding:1px 5px; font-size:.72rem; font-weight:800; color:var(--red-dark);
  white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.25); cursor:pointer;
  pointer-events:auto;
}
.gugong-label::before{ display:none; }

/* ---------- MODAL ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(20,14,10,.6);
  display:none; align-items:flex-start; justify-content:center;
  z-index:999; padding: 20px; overflow-y:auto;
}
.modal-overlay.show{display:flex;}
.modal{
  background: var(--panel);
  max-width: 760px; width:100%;
  border-radius: 22px;
  margin-top: 30px;
  box-shadow: 0 30px 60px rgba(0,0,0,.4);
  overflow:hidden;
  border: 4px solid var(--gold);
}
.modal-img{width:100%; max-height:320px; object-fit:cover; display:block;}
.modal-body{padding: 26px 28px 30px;}
.modal-body h2{ font-size:1.8rem; color:var(--red-dark); margin:0 0 6px;}
.modal-body .loc{ color:var(--ink-soft); font-size:1rem; margin-bottom:16px; display:flex; align-items:center; gap:6px;}
.modal-body p{font-size:1.12rem; margin: 0 0 14px; color:var(--ink);}
.modal-close{
  position:sticky; top:0; float:right;
  background: var(--red); color:#fff; border:none;
  width:44px; height:44px; border-radius:50%;
  font-size:1.4rem; cursor:pointer; margin:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.3);
}
.modal-close:hover{background:var(--red-dark);}
.modal-tags{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.modal-tags span{
  background: var(--paper-deep); border:1px solid var(--line); border-radius:999px;
  padding:4px 12px; font-size:.9rem; color:var(--ink-soft);
}
.big-btn{
  display:inline-block; margin-top:10px;
  background: var(--gold); color:#fff; border:none;
  padding: 14px 22px; border-radius:14px; font-size:1.1rem; font-weight:700;
  cursor:pointer;
}
.big-btn:hover{background:#b3841f;}

/* ---------- FORBIDDEN CITY VIEW ---------- */
.gugong-btn-wrap{ text-align:center; margin: 26px 0 6px;}
.gugong-enter{
  background: linear-gradient(135deg, var(--red), var(--red-dark));
  color:#FBEFD9; border:3px solid var(--gold);
  padding: 18px 30px; border-radius:18px; font-size:1.3rem; font-weight:900;
  cursor:pointer; box-shadow: var(--shadow); letter-spacing:.1em;
}
.gugong-enter:hover{ transform:translateY(-2px);}

.gugong-view{ display:none; }
.gugong-view.show{ display:block; }
.gugong-header{
  text-align:center; padding: 30px 16px 10px;
  background: radial-gradient(800px 260px at 50% -20%, rgba(201,150,46,.25), transparent 65%), var(--red-dark);
  color:#FBEFD9; border-radius: 22px 22px 0 0;
}
.gugong-header h2{font-size:2.1rem; margin:0 0 6px;}
.gugong-header p{margin:0; opacity:.9;}
.back-btn{
  background:transparent; border:2px solid var(--gold-light); color:#FBEFD9;
  border-radius:12px; padding:10px 18px; font-size:1rem; cursor:pointer; margin-top:16px;
}
.gugong-body{ background: var(--paper-deep); border-radius:0 0 22px 22px; padding: 26px 18px 40px;}
.plan-block{
  background:var(--panel); border-radius: var(--radius); border:2px solid var(--line);
  box-shadow: var(--shadow); padding: 20px; margin-bottom:28px;
}
.plan-block h3{ color:var(--red-dark); font-size:1.4rem; margin:0 0 6px;}
.plan-block .desc{ color:var(--ink-soft); margin-bottom:14px; font-size:1.05rem;}
.plan-img-wrap{ position:relative; border-radius:14px; overflow:hidden; border:3px solid var(--gold-light);}
.plan-img-wrap img{width:100%; display:block;}
.hotspot{
  position:absolute; border:3px dashed rgba(158,42,43,.85);
  background: rgba(201,150,46,.18);
  cursor:pointer; border-radius:8px;
  transition: background .15s ease;
}
.hotspot:hover{ background: rgba(201,150,46,.4);}
.hotspot-label{
  position:absolute; bottom:4px; left:4px;
  background: var(--red); color:#fff; font-size:.85rem; font-weight:700;
  padding:2px 8px; border-radius:6px; pointer-events:none;
}
.gallery-grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
.gallery-card{
  background:var(--panel); border:2px solid var(--line); border-left:8px solid var(--bronze);
  border-radius:14px; padding:16px 18px; cursor:pointer; box-shadow:var(--shadow);
}
.gallery-card.exhibit{ border-left-color: var(--plum); }
.gallery-card h4{margin:0 0 6px; font-size:1.15rem; color:var(--ink);}
.gallery-card .where{ font-size:.9rem; color:var(--gold); font-weight:700; margin-bottom:6px;}
.gallery-card p{margin:0; font-size:.98rem; color:var(--ink-soft);}

footer{
  text-align:center; padding: 26px; color:var(--ink-soft); font-size:.95rem;
}
footer .imperial-rule{margin-bottom:16px;}

@media (max-width:640px){
  :root{font-size:19px;}
  .hero h1{font-size:2rem;}
  #map{height:360px;}
  /* On phones the sticky day-selector permanently eats into limited screen space and
     crowds the content underneath it, so let it scroll away with the page instead. */
  nav.day-nav{ position:static; }
  .day-btn{ padding:10px 14px; min-height:48px; min-width:100px; }
}
</style>
</head>
<body>

<header class="hero">
  <h1>相約北京</h1>
  <a href="game.html" style="position:relative; z-index:5; display:inline-flex; align-items:center; gap:6px; margin-top:14px; font-size:.95rem; font-weight:600; color:#2a1508; background:linear-gradient(160deg,var(--gold-light),var(--gold)); text-decoration:none; border-radius:24px; padding:8px 20px; box-shadow:0 4px 14px rgba(0,0,0,.35);">🏮 皇城探祕記：明清時光機 →</a>
</header>
<div class="imperial-rule"></div>

<nav class="day-nav" id="dayNav"></nav>

<main>
  <div class="day-heading">
    <h2 id="dayTitle">Day 1</h2>
    <div class="hotel-chip" id="hotelChip"></div>
  </div>

  <div id="map"></div>
  <p class="map-hint">💡 點一下圖釘看大字介紹！</p>

  <div class="legend">
    <span><i class="dot" style="background:var(--blue)"></i>飯店</span>
    <span><i class="dot" style="background:var(--jade)"></i>用餐地點</span>
    <span><i class="dot" style="background:var(--red)"></i>遊覽景點</span>
  </div>

  <div class="section-title"><span class="bead"></span>今日景點與路線</div>
  <div class="grid" id="stopGrid"></div>

  <div class="section-title"><span class="bead"></span>今日三餐</div>
  <div class="grid" id="mealGrid"></div>

  <div class="section-title"><span class="bead"></span>今晚住宿</div>
  <div class="grid" id="hotelGrid"></div>

  <!-- 旅途相簿與見聞（journal.js） -->
  <div id="journalMount"></div>

  <div class="gugong-btn-wrap" id="gugongEntry" style="display:none;">
    <button class="gugong-enter" id="gugongBtn">🏯 進入「故宮深度導覽」</button>
  </div>

  <!-- ============ FORBIDDEN CITY DEEP DIVE ============ -->
  <section class="gugong-view" id="gugongView">
    <div class="gugong-header">
      <h2>故宮博物院 深度導覽</h2>
      <p>從天上看故宮，到認識每一座宮殿的用途與展覽</p>
      <button class="back-btn" id="backBtn">⬅ 回到行程地圖</button>
    </div>
    <div class="gugong-body" id="gugongBody"></div>
  </section>

</main>

<footer>
  <div class="imperial-rule"></div>
  資料整理自行程手冊與公開資訊
</footer>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <img class="modal-img" id="modalImg" src="" alt="" style="display:none;">
    <div class="modal-body">
      <h2 id="modalTitle"></h2>
      <div class="loc" id="modalLoc"></div>
      <div class="modal-tags" id="modalTags"></div>
      <div id="modalText"></div>
      <button class="big-btn" id="modalGugongBtn" style="display:none;">🏯 查看故宮深度導覽</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-polylinedecorator/1.6.0/leaflet.polylineDecorator.js"></script>

/* =========================================================
   APP STATE / RENDER
   ========================================================= */
let map, markersLayer, routeLayer, router;
let currentDayIdx = 0;

function iconFor(kind, color){
  const emoji = kind==="hotel" ? "🏨" : kind==="meal" ? "🍽️" : "📍";
  return L.divIcon({
    className:"",
    html:`<div style="background:${color};width:38px;height:38px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;">
            <span style="transform:rotate(45deg);font-size:18px;">${emoji}</span>
          </div>`,
    iconSize:[38,38], iconAnchor:[19,36], popupAnchor:[0,-34]
  });
}

function numberedIcon(num, color){
  return L.divIcon({
    className:"",
    html:`<div style="background:${color};width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;">
            <span style="transform:rotate(45deg);font-size:18px;font-weight:900;color:#fff;">${num}</span>
          </div>`,
    iconSize:[40,40], iconAnchor:[20,38], popupAnchor:[0,-36]
  });
}

function timeChip(latlng, minutes, color){
  return L.marker(latlng, {
    icon: L.divIcon({
      className:"",
      html:`<div style="background:#fff;border:2px solid ${color};border-radius:10px;padding:3px 10px;font-size:.85rem;font-weight:800;color:${color};white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25);">🚗 約${minutes}分鐘</div>`,
      iconSize:null
    }),
    interactive:false
  });
}

function initMap(){
  map = L.map('map', {scrollWheelZoom:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'&copy; OpenStreetMap'
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
  routeLayer = L.layerGroup().addTo(map);
  router = L.Routing.osrmv1({serviceUrl:'https://router.project-osrm.org/route/v1'});
}

function clearRouting(){
  routeLayer.clearLayers();
}

// draws one leg (stop i -> stop i+1): real driving path + arrowheads + drive-time chip.
// falls back to a plain dashed line (no time chip) if the routing service doesn't respond.
const ROUTE_CACHE_KEY='hcts-route-cache-v1';
let routeCache={};
try{ routeCache=JSON.parse(localStorage.getItem(ROUTE_CACHE_KEY)||'{}'); }catch(e){ routeCache={}; }
function legKey(a,b){ return [a.lat,a.lng,b.lat,b.lng].map(v=>v.toFixed(4)).join(','); }

function paintLeg(coords, mins, color){
  const line = L.polyline(coords, {color:color, weight:5, opacity:.85}).addTo(routeLayer);
  if(window.L && L.polylineDecorator){
    L.polylineDecorator(line, {
      patterns: [{
        offset:'80%', repeat:0,
        symbol: L.Symbol.arrowHead({pixelSize:14, polygon:true, pathOptions:{color:color, fillOpacity:1, weight:0}})
      }]
    }).addTo(routeLayer);
  }
  timeChip(coords[Math.floor(coords.length/2)], mins, color).addTo(routeLayer);
}

function drawLeg(from, to, color){
  const k = legKey(from,to);
  const hit = routeCache[k];
  if(hit){ paintLeg(hit.c.map(p=>L.latLng(p[0],p[1])), hit.m, color); return; }
  router.route(
    [{latLng:from},{latLng:to}],
    function(err, routes){
      if(err || !routes || !routes.length){
        L.polyline([from,to], {color:color, weight:4, dashArray:'8,8', opacity:.8}).addTo(routeLayer);
        return;
      }
      const route = routes[0];
      const mins = Math.max(1, Math.round(route.summary.totalTime/60));
      paintLeg(route.coordinates, mins, color);
      // keep a thinned copy (every 3rd point) so the cache stays small
      const thin = route.coordinates.filter((p,i,a)=> i%3===0 || i===a.length-1).map(p=>[+p.lat.toFixed(5), +p.lng.toFixed(5)]);
      routeCache[k] = {c:thin, m:mins};
      try{ localStorage.setItem(ROUTE_CACHE_KEY, JSON.stringify(routeCache)); }catch(e){}
    }
  );
}

// the day's route starts from the hotel where everyone slept last night (day.start),
// visits each pinned stop in order, then ends back at tonight's hotel
// (except the last day, whose "hotel" is home in Taiwan — skipBounds)
function routePoints(day){
  const pts = day.stops.filter(s=>s.lat!=null);
  const out = day.start ? [day.start, ...pts] : pts;
  if(day.hotel && day.hotel.lat && !day.hotel.skipBounds) out.push(day.hotel);
  return out;
}

function drawRouteLegs(day){
  clearRouting();
  const pinned = routePoints(day);
  for(let i=0;i<pinned.length-1;i++){
    const from = L.latLng(pinned[i].lat, pinned[i].lng);
    const to = L.latLng(pinned[i+1].lat, pinned[i+1].lng);
    drawLeg(from, to, day.color);
  }
}

function renderDayNav(){
  const nav = document.getElementById('dayNav');
  nav.innerHTML = '';
  DAYS.forEach((d,i)=>{
    const b = document.createElement('button');
    b.className='day-btn'+(i===currentDayIdx?' active':'');
    b.style.setProperty('--day-color', d.color);
    b.innerHTML = `${d.label}<small>${d.short}</small>`;
    b.onclick = ()=>{ currentDayIdx=i; renderAll(); };
    nav.appendChild(b);
  });
}

function chip(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstChild; }

function photoBlock(img, color){
  return img
    ? `<img class="card-photo" src="${img}" alt="" loading="lazy" decoding="async">`
    : `<div class="card-photo-placeholder" style="--day-color:${color}">📍</div>`;
}

function renderDay(){
  const day = DAYS[currentDayIdx];
  document.documentElement.style.setProperty('--day-color', day.color);
  document.getElementById('dayTitle').textContent = `${day.label}｜${day.title}`;
  const hotelNames = [day.hotel.name, day.altHotel? day.altHotel.name : null].filter(Boolean).join(' 或 ');
  document.getElementById('hotelChip').innerHTML = `🏨 今晚下榻：<b>${hotelNames}</b>`;

  // map
  markersLayer.clearLayers();
  clearRouting();
  map.setView(day.center, day.zoom);

  const allMarkerLatLngs = [];

  // hotel marker(s)
  const hotelList = [day.hotel, day.altHotel].filter(Boolean);
  hotelList.forEach(h=>{
    if(h.lat){
      L.marker([h.lat, h.lng], {icon: iconFor('hotel', '#2B5F75')})
        .addTo(markersLayer)
        .bindPopup(`<b>🏨 ${h.name}</b>`)
        .on('click', ()=> openModal({title:h.name, loc:'住宿選項', text:h.desc, tags:['飯店', h.note]}));
      // backup/alternate hotels and the final "flying home" placeholder are often far
      // from the day's actual sightseeing area, so they're excluded from the auto-zoom
      // bounds — otherwise they'd force the map to zoom out until the real stops (e.g.
      // the Forbidden City) are squeezed into a tiny, indistinguishable cluster.
      if(!h.skipBounds){ allMarkerLatLngs.push(L.latLng(h.lat,h.lng)); }
    }
  });

  // start-of-day hotel (last night's hotel) — pinned unless it is also tonight's hotel
  if(day.start){
    const same = hotelList.some(h=>h.lat===day.start.lat && h.lng===day.start.lng);
    if(!same){
      L.marker([day.start.lat, day.start.lng], {icon: iconFor('hotel', '#2B5F75')})
        .addTo(markersLayer)
        .bindPopup(`<b>🏨 出發：${day.start.name}</b>`);
    }
    allMarkerLatLngs.push(L.latLng(day.start.lat, day.start.lng));
  }

  // meal markers (breakfast is never pinned — it's written into the hotel card)
  day.meals.forEach(m=>{
    if(m.lat){
      L.marker([m.lat,m.lng], {icon: iconFor('meal', '#4C7A5A')})
        .addTo(markersLayer)
        .bindPopup(`<b>🍽️ ${m.type}：${m.name}</b>`)
        .on('click', ()=> openModal({title:m.name, loc:m.type, text:m.desc, tags:[m.type]}));
      allMarkerLatLngs.push(L.latLng(m.lat,m.lng));
    }
  });

  // stop markers — numbered pins (1,2,3…) so the visiting order is obvious at a glance
  day.stops.forEach((s,idx)=>{
    if(s.lat==null) return;  // e.g. 雜技秀 — venue decided by the local agency, so no pin
    L.marker([s.lat,s.lng], {icon: numberedIcon(idx+1, day.color)})
      .addTo(markersLayer)
      .bindPopup(`<b>${idx+1}. ${s.name}</b>${s.stay?`<br>預計停留 ${s.stay}`:''}`)
      .on('click', ()=> openModal({title:s.name, loc:`第 ${idx+1} 站　・　預計停留 ${s.stay||'—'}`, text:s.desc, tags: s.special? ['深度導覽可用'] : ['景點'], gugong: s.special==='gugong', img:s.img}));
    allMarkerLatLngs.push(L.latLng(s.lat,s.lng));
  });

  // fit map to show every marker (hotel + meals + stops), not just the route
  if(allMarkerLatLngs.length){
    map.fitBounds(L.latLngBounds(allMarkerLatLngs), {padding:[36,36], maxZoom:15});
  }

  // draw real driving routes leg-by-leg between stops, each with an arrow + drive-time chip
  if(routePoints(day).length>1){ drawRouteLegs(day); }

  // stop cards
  const stopGrid = document.getElementById('stopGrid');
  stopGrid.innerHTML='';
  if(day.start){
    const sn = document.createElement('div');
    sn.className='breakfast-note';
    sn.style.gridColumn='1 / -1'; sn.style.marginTop='0';
    sn.innerHTML = `🏨 <b>出發：</b>早上從「${day.start.name}」出發，地圖上的路線從飯店開始。`;
    stopGrid.appendChild(sn);
  }
  const endNote = (day.hotel && !day.hotel.skipBounds)
    ? `🌙 <b>回飯店：</b>行程結束後回到「${day.hotel.name}」休息，地圖上的路線最後一段就是回飯店。`
    : null;
  day.stops.forEach((s,idx)=>{
    const c = chip(`<div class="card stop" style="--day-color:${day.color}">
      ${photoBlock(s.img, day.color)}
      <div class="num">${idx+1}</div>
      <span class="kicker" style="--day-color:${day.color}">景點</span>
      ${s.stay? `<span class="kicker" style="--day-color:#8B5E34;">⏱ 停留 ${s.stay}</span>`:''}
      <h3>${s.name}${s.special?' 🏯':''}</h3>
      <p>${s.desc.slice(0,54)}…</p>
      ${s.special? '<div class="open-hint">點我看深度導覽 →</div>':''}
    </div>`);
    c.onclick = ()=> openModal({title:s.name, loc:`第 ${idx+1} 站　・　預計停留 ${s.stay||'—'}`, text:s.desc, tags: s.special?['深度導覽可用']:['景點'], gugong: s.special==='gugong', img:s.img});
    stopGrid.appendChild(c);
  });

  if(endNote){
    const en = document.createElement('div');
    en.className='breakfast-note';
    en.style.gridColumn='1 / -1'; en.style.marginTop='0';
    en.innerHTML = endNote;
    stopGrid.appendChild(en);
  }

  // meal cards (lunch & dinner only)
  const mealGrid = document.getElementById('mealGrid');
  mealGrid.innerHTML='';
  day.meals.forEach(m=>{
    const c = chip(`<div class="card meal">
      <span class="kicker" style="--day-color:#4C7A5A">${m.type}</span>
      <h3>${m.name}</h3>
      <p>${m.desc}</p>
    </div>`);
    c.onclick = ()=> openModal({title:m.name, loc:m.type, text:m.desc, tags:[m.type]});
    mealGrid.appendChild(c);
  });

  // hotel card(s) + breakfast note
  const hotelGrid = document.getElementById('hotelGrid');
  hotelGrid.innerHTML = hotelList.map(h=>`<div class="card hotel">
      <span class="kicker" style="--day-color:#2B5F75">住宿</span>
      <h3>${h.name}</h3>
      <p>${h.note}</p>
      <p style="margin-top:8px;">${h.desc}</p>
    </div>`).join('');
  Array.from(hotelGrid.children).forEach((el,i)=>{
    const h = hotelList[i];
    el.onclick = ()=> openModal({title:h.name, loc:'住宿選項', text:h.desc, tags:['飯店', h.note]});
  });
  if(day.breakfast){
    const note = document.createElement('div');
    note.className='breakfast-note';
    note.innerHTML = `🍳 <b>早餐：</b>${day.breakfast}`;
    hotelGrid.appendChild(note);
  }

  // forbidden city entry button
  const hasGugong = day.stops.some(s=>s.special==='gugong');
  document.getElementById('gugongEntry').style.display = hasGugong? 'block':'none';
  document.getElementById('gugongView').classList.remove('show');
  if(window.Journal) Journal.onDay(day);
}

function renderDayNavActive(){
  document.querySelectorAll('.day-btn').forEach((b,i)=>{
    b.classList.toggle('active', i===currentDayIdx);
  });
}

function renderAll(){
  renderDayNav();
  renderDay();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- MODAL ---------- */
function openModal({title, loc, text, tags=[], gugong=false, img=null}){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalLoc').textContent = loc || '';
  document.getElementById('modalText').innerHTML = `<p>${text}</p>`;
  const tagWrap = document.getElementById('modalTags');
  tagWrap.innerHTML = tags.map(t=>`<span>${t}</span>`).join('');
  const modalImg = document.getElementById('modalImg');
  if(img){ modalImg.src = img; modalImg.style.display='block'; }
  else { modalImg.style.display='none'; }
  document.getElementById('modalGugongBtn').style.display = gugong? 'inline-block':'none';
  document.getElementById('modalOverlay').classList.add('show');
  if(window.Journal) Journal.onModal(title);
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
document.getElementById('modalGugongBtn').onclick = ()=>{ closeModal(); enterGugong(); };

/* ---------- FORBIDDEN CITY VIEW ---------- */
function enterGugong(){
  const body = document.getElementById('gugongBody');
  body.innerHTML = '';

  const panoBlock = document.createElement('div');
  panoBlock.className='plan-block';
  panoBlock.innerHTML = `
    <h3>🖥️ 行前先「雲遊」一次故宮</h3>
    <div class="desc">故宮博物院官方推出的「全景故宮」，把太和殿、乾清宮、御花園等主要宮殿都拍成 360 度全景實景，還配有故宮專家寫的詳細解說，可以像走在現場一樣用滑鼠拖曳環顧四周。強烈建議出發前先上網「雲遊」一次故宮，熟悉環境、記住幾個宮殿的位置，現場走起來會更有親切感、更不容易累。</div>
    <a href="https://pano.dpm.org.cn" target="_blank" rel="noopener" class="big-btn" style="text-decoration:none;">🏯 開啟全景故宮官方網站</a>
    <div class="desc" style="margin-top:10px;">💡 提醒：這個網站需要用電腦或平板的瀏覽器開啟效果最好，手機網路建議在有 Wi-Fi 的地方使用。</div>
  `;
  body.appendChild(panoBlock);

  const mapBlock = document.createElement('div');
  mapBlock.className='plan-block';
  mapBlock.innerHTML = `
    <h3>📍 每座宮殿的實際位置（真實地圖）</h3>
    <div class="desc">下面這個地圖跟每天行程用的是同一種真實地圖（OpenStreetMap），每個圖釘都是那座宮殿實際的地理位置，不是畫在圖片上的示意位置。點一下圖釘，就能看到那座宮殿的介紹，有照片的也會顯示照片。</div>
    <div class="map-fullscreen-wrap" id="gugongMapWrap">
      <div id="gugongMap" class="zoom-map"></div>
      <button class="fullscreen-btn" id="gugongFullscreenBtn">⛶ 全螢幕</button>
    </div>
  `;
  body.appendChild(mapBlock);

  const zoomableBlocks = [];
  GUGONG_PLANS.forEach(p=>{
    const block = document.createElement('div');
    block.className='plan-block';
    if(p.zoomable){
      const mapId = 'planZoom_' + p.key;
      block.innerHTML = `
        <h3>${p.title}</h3>
        <div class="desc">${p.desc}</div>
        <div id="${mapId}" class="zoom-map"></div>
        <div class="zoom-hint">🔍 用兩指或滾輪縮放，拖曳可以移動，跟看地圖一樣操作</div>
      `;
      zoomableBlocks.push({id:mapId, plan:p});
    } else {
      block.innerHTML = `
        <h3>${p.title}</h3>
        <div class="desc">${p.desc}</div>
        <div class="plan-img-wrap">
          <img src="${p.img}" alt="${p.title}">
        </div>
      `;
    }
    body.appendChild(block);
  });

  // real-coordinate Forbidden City map — same Leaflet + OpenStreetMap setup as the daily itinerary maps
  const gmap = L.map('gugongMap', {scrollWheelZoom:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'&copy; OpenStreetMap'
  }).addTo(gmap);
  const gBounds = [];
  GUGONG_BUILDINGS.forEach(b=>{
    // small dot + permanent text label (like an OSM place name), instead of a big pin icon --
    // with 30+ halls this close together, pins overlap and hide the map; text labels stay legible.
    const openHallModal = ()=> openModal({title:b.name, loc:'故宮宮殿位置', text:b.desc, tags:b.tags||[], img:b.img});
    L.circleMarker([b.lat,b.lng], {radius:4, weight:2, color:'#9E2A2B', fillColor:'#9E2A2B', fillOpacity:1})
      .addTo(gmap)
      .bindTooltip(b.name, {permanent:true, direction:'top', offset:[0,-4], className:'gugong-label'})
      .on('click', openHallModal)
      .on('tooltipopen', e=>{
        const el = e.tooltip.getElement();
        if(el){ el.style.pointerEvents='auto'; el.addEventListener('click', openHallModal); }
      });
    gBounds.push(L.latLng(b.lat,b.lng));
  });
  gmap.fitBounds(L.latLngBounds(gBounds), {padding:[24,24]});
  setTimeout(()=>gmap.invalidateSize(), 50);

  // fullscreen toggle — makes the map fill the whole screen, handy for reading small labels
  const fsWrap = document.getElementById('gugongMapWrap');
  const fsBtn = document.getElementById('gugongFullscreenBtn');
  fsBtn.onclick = ()=>{
    if(!document.fullscreenElement){
      (fsWrap.requestFullscreen || fsWrap.webkitRequestFullscreen || fsWrap.msRequestFullscreen).call(fsWrap);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
    }
  };
  ['fullscreenchange','webkitfullscreenchange'].forEach(evt=>{
    document.addEventListener(evt, ()=>{
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      fsBtn.textContent = isFs ? '✕ 離開全螢幕' : '⛶ 全螢幕';
      setTimeout(()=>gmap.invalidateSize(), 100);
    });
  });

  // initialize zoomable (pannable/pinchable) plan viewers using Leaflet's simple CRS.
  // maxZoom is capped at native pixel resolution (0) so the browser never has to
  // upscale/blur the image beyond the detail that actually exists in the source picture.
  zoomableBlocks.forEach(({id, plan})=>{
    const zmap = L.map(id, {
      crs: L.CRS.Simple, minZoom: -3, maxZoom: 0, zoomSnap: 0.25, zoomDelta: 0.5,
      zoomControl:true, attributionControl:false
    });
    const bounds = [[0,0],[plan.h, plan.w]];
    L.imageOverlay(plan.img, bounds).addTo(zmap);
    zmap.fitBounds(bounds);
    setTimeout(()=>zmap.invalidateSize(), 50);

    if(plan.key==='full'){
      FULL_PLAN_LABELS.forEach(lbl=>{
        const px = (lbl.x/100) * plan.w;
        const py = plan.h - (lbl.y/100) * plan.h; // convert "% from top" to Leaflet's bottom-up lat
        L.marker([py, px], {
          icon: L.divIcon({
            className:"",
            html:`<div style="display:inline-block;background:rgba(255,253,247,.92);border:1.5px solid #9E2A2B;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:800;color:#7A1F20;white-space:nowrap;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.3);">${lbl.name}</div>`,
            iconSize:null
          }),
          interactive:false
        }).addTo(zmap);
      });
    }
  });

  // gallery lists
  const permWrap = document.createElement('div');
  permWrap.innerHTML = `<div class="section-title"><span class="bead"></span>常設專館（依文物類別固定展出）</div>`;
  const permGrid = document.createElement('div'); permGrid.className='gallery-grid';
  GUGONG_GALLERIES.filter(g=>g.type==='perm').forEach(g=>{
    const c = chip(`<div class="gallery-card"><div class="where">📍 ${g.where}</div><h4>${g.name}</h4><p>${g.desc.slice(0,46)}…</p></div>`);
    c.onclick = ()=> openModal({title:g.name, loc:g.where, text:g.desc, tags:['常設專館']});
    permGrid.appendChild(c);
  });
  permWrap.appendChild(permGrid);
  body.appendChild(permWrap);

  const exWrap = document.createElement('div');
  exWrap.style.marginTop='30px';
  exWrap.innerHTML = `<div class="section-title"><span class="bead"></span>陳列館（不定期特展空間）</div>`;
  const exGrid = document.createElement('div'); exGrid.className='gallery-grid';
  GUGONG_GALLERIES.filter(g=>g.type==='exhibit').forEach(g=>{
    const c = chip(`<div class="gallery-card exhibit"><div class="where">📍 ${g.where}</div><h4>${g.name}</h4><p>${g.desc.slice(0,46)}…</p></div>`);
    c.onclick = ()=> openModal({title:g.name, loc:g.where, text:g.desc, tags:['陳列館・特展空間']});
    exGrid.appendChild(c);
  });
  exWrap.appendChild(exGrid);
  body.appendChild(exWrap);

  document.getElementById('gugongView').classList.add('show');
  document.getElementById('gugongView').scrollIntoView({behavior:'smooth'});
}
document.getElementById('gugongBtn').onclick = enterGugong;
document.getElementById('backBtn').onclick = ()=>{
  document.getElementById('gugongView').classList.remove('show');
  document.getElementById('map').scrollIntoView({behavior:'smooth'});
};

/* ---------- INIT ---------- */
initMap();
renderAll();
</script>
<script src="journal.js"></script>
<script src="book.js"></script>
<script src="pwa.js"></script>
</body>
</html>
